# Decap CMS configuration — git-based admin for setiatrafik.com
# Content is edited here, committed to GitHub, and Netlify auto-deploys it live.

backend:
  name: github
  repo: setiatrafiksdnbhd2026-droid/setia-trafik-website
  branch: main
  # Auth is handled by Netlify's OAuth provider (GitHub). See setup steps.

# Where images uploaded through the admin are stored
media_folder: "uploads"
public_folder: "/uploads"

# Show a live "Publish" button; changes commit straight to the main branch
publish_mode: simple

site_url: https://setiatrafik.com
display_url: https://setiatrafik.com
logo_url: https://setiatrafik.com/favicon.png

collections:
  # ── NEWS & PROJECTS ─────────────────────────────────────────────
  - name: news
    label: "News & Projects"
    description: "Add, edit, reorder or remove the news cards shown on the News page."
    files:
      - name: news_list
        label: "News Posts"
        file: "news-data.json"
        description: "The list of news/announcement cards."
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            label_singular: "Post"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date (e.g. JUNE 2025)", name: "date", widget: "string" }
              - { label: "Image", name: "image", widget: "image", required: false }
              - { label: "Summary", name: "summary", widget: "text" }
              - label: "Link slug (e.g. penang-ayer-itam-bypass)"
                name: "slug"
                widget: "string"
                required: false
                hint: "Used for the 'Read More' link: /news/your-slug"

  # ── PRODUCTS ────────────────────────────────────────────────────
  - name: products
    label: "Products"
    description: "Add, edit or remove products shown on the product category pages."
    files:
      - name: product_list
        label: "Product Catalog"
        file: "products-data.json"
        description: "All products across every category."
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            label_singular: "Product"
            summary: "{{fields.cat}} — {{fields.name}} ({{fields.sku}})"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "SKU / Code", name: "sku", widget: "string", required: false }
              - label: "Category"
                name: "cat"
                widget: "select"
                options:
                  - "Barriers & Hoardings"
                  - "Cones & Posts"
                  - "Convex Mirrors & Safety"
                  - "Lights & Blinkers"
                  - "PPE & Safety"
                  - "Road Studs & Accessories"
                  - "Signage"
                  - "VMS / Solar PVMS"
              - { label: "Image", name: "img", widget: "image", required: false }
              - label: "Slug (URL id, e.g. pe-cone-750)"
                name: "slug"
                widget: "string"
                hint: "Lowercase, dashes only. Used for the product link: /product/your-slug"
